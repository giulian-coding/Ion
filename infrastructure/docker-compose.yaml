services:
  nats:
    image: nats:alpine
    container_name: nats-server
    ports:
      - "4222:4222"
      - "9222:9222"
      - "8222:8222"
    command:
      # Lade die Konfigurationsdatei
      - "-c"
      - "/etc/nats/nats.conf"
    volumes:
      # Mounte unsere lokale nats.conf in den Container (Read-Only)
      - ./nats.conf:/etc/nats/nats.conf:ro
      # Volume für die JetStream Persistenz
      - nats-data:/data
    restart: unless-stopped

volumes:
  nats-data: