port: 4222
monitor_port: 8222

jetstream {
    store_dir: "/data/jetstream"
}

websocket {
    port: 9222
    no_tls: true
}

accounts {
  SYS: {
    users: [
      { user: "sys", password: $SYS_PASSWORD }
    ]
  }

  APP: {
    jetstream: {
      max_mem: 512M
      max_file: 5G
    }
    users: [
      { user: "backend", password: $APP_PASSWORD }
    ]
    exports: [
      { stream: "public.>" }
    ]
  }

  WEB: {
    users: [
      { user: "browser", password: $WEB_PASSWORD,
        permissions: {
          subscribe: { allow: ["public.>", "_INBOX.>"] }
          publish:   { deny:  [">"] }
        }
      }
    ]
    imports: [
      { stream: { account: "APP", subject: "public.>" } }
    ]
  }
}

system_account: SYS